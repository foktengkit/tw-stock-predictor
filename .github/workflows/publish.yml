# 公開版網站（持續部署）：測試 → 同步官方盤後資料 → 建置 → 發布到 GitHub Pages → 上線驗證
# 官方資料庫存在 Actions 快取裡，每次只補新資料（第一次約 3 小時，之後幾分鐘）
name: 公開版網站

on:
  # 網站相關的程式推送到 main → 測試通過就自動發布
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'lib/**'
      - 'scripts/build-public.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish.yml'
  # 每個交易日更新資料。避開整點與半點：GitHub 的排程在這些時間最擁擠、最容易延遲
  schedule:
    - cron: '23 14 * * 1-5' # 平日台北時間 22:23（融資融券約晚間才公布；還沒公布的隔天會補上）
  workflow_dispatch:
    inputs:
      deploy:
        description: 建置完成後發布到 GitHub Pages
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 測試與建置
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      built_at: ${{ steps.build.outputs.built_at }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: 測試（沒過就不建置、不發布）
        run: npm test

      - name: 還原官方資料庫
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: data
          key: official-data-${{ github.run_id }}
          restore-keys: official-data-

      - name: 同步官方資料
        timeout-minutes: 310 # 第一次回補很久；逾時也會存檔，下次接著抓
        run: node lib/official/sync.js --daily-years 5 --chips-years 2.5 --revenue-years 5 --otc-daily-years 5

      - name: 建置公開版
        id: build
        run: |
          node scripts/build-public.js --out dist
          echo "built_at=$(node -p "require('./dist/data/meta.json').builtAt")" >> "$GITHUB_OUTPUT"

      # 放在建置之後：建置時更新的股票清單、休市日曆也要存起來，下次官方網站暫時連不上時可以沿用
      - name: 儲存官方資料庫
        if: always() && steps.restore.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data
          key: official-data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 發布
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: 上線驗證
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 檢查線上版本與資料，並用瀏覽器實際打開網站
        run: node scripts/verify-site.js "${{ needs.deploy.outputs.page_url }}" --expect-built-at "${{ needs.build.outputs.built_at }}" --browser
