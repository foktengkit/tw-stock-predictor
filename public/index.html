<!doctype html>
<html lang="zh-Hant-TW" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>台股觀測站</title>
  <meta name="description" content="台灣股市即時報價、K 線圖、技術分析與 AI 股價預測" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232962ff'/%3E%3Cpath d='M6 22l6-7 5 4 9-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#2330" title="台股觀測站">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M6 22l6-7 5 4 9-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>台股觀測站</span>
    </a>
    <div class="search" id="searchBox">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16"><path d="M10.5 3a7.5 7.5 0 015.96 12.05l4.25 4.24-1.42 1.42-4.24-4.25A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z" fill="currentColor"/></svg>
      <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="搜尋代號或名稱，例：2330、台積電" />
      <div class="search-results" id="searchResults" hidden></div>
    </div>
    <div class="indices" id="indices"></div>
    <div class="spacer"></div>
    <div class="conn" id="conn" title="即時資料連線狀態"><span class="dot"></span><span class="txt">連線中…</span></div>
    <div class="mstatus-wrap">
      <button class="mstatus" id="mstatus" title="查看休市日曆與即時檢查狀態"><span class="badge">—</span><span class="clock" id="clock"></span></button>
      <div class="cal-pop" id="calPop" hidden></div>
    </div>
    <button class="icon-btn" id="themeBtn" title="切換深色 / 淺色主題" aria-label="切換主題">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zm0 2v14a7 7 0 010-14z" fill="currentColor"/></svg>
    </button>
  </header>

  <main class="layout">
    <nav class="tools" id="tools" aria-label="繪圖工具">
      <button data-tool="magnet" title="磁吸十字線"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <button data-tool="hline" title="水平線（點擊圖表放置）"><svg viewBox="0 0 24 24"><path d="M3 12h18" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/></svg></button>
      <button data-tool="clear" title="清除所有水平線"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
      <div class="tool-sep"></div>
      <button data-tool="fit" title="重設縮放"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
      <button data-tool="shot" title="下載圖表截圖"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="12" cy="13" r="3.5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
    </nav>

    <section class="center">
      <div class="chart-toolbar">
        <div class="sym-title">
          <b id="symCode">—</b><span id="symName"></span><span class="tag" id="symMarket"></span>
        </div>
        <div class="seg" id="tfGroup">
          <button data-tf="1m">1分</button><button data-tf="5m">5分</button><button data-tf="15m">15分</button><button data-tf="60m">60分</button><button data-tf="D">日</button><button data-tf="W">週</button><button data-tf="M">月</button>
        </div>
        <div class="tb-sep"></div>
        <select id="chartType" title="圖表類型">
          <option value="candles">K 線</option><option value="bars">美國線</option><option value="line">折線</option><option value="area">面積</option>
        </select>
        <div class="dropdown" id="indMenu">
          <button class="tb-btn" id="indBtn">指標 <span class="caret">▾</span></button>
          <div class="menu" id="indList" hidden></div>
        </div>
        <label class="chk" title="在日線圖顯示未來 20 個交易日的預測路徑與 80% 區間"><input type="checkbox" id="showForecast" checked /><span>AI 預測線</span></label>
        <label class="chk" title="標示 5 日 / 20 日均線黃金交叉與死亡交叉"><input type="checkbox" id="showSignals" /><span>交叉訊號</span></label>
      </div>
      <div class="chart-wrap">
        <div id="chart"></div>
        <div class="legend" id="legend"></div>
        <div class="chart-msg" id="chartMsg" hidden></div>
      </div>
      <div class="bottom" id="bottom">
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="predict" class="active">AI 預測</button>
          <button role="tab" data-tab="chips">籌碼・營收</button>
          <button role="tab" data-tab="tech">技術分析</button>
          <button role="tab" data-tab="heat">台灣50 熱力圖</button>
          <div class="spacer"></div>
          <button class="icon-btn" id="collapseBtn" title="收合 / 展開面板"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none"/></svg></button>
        </div>
        <div class="tab-body" id="tab-predict"></div>
        <div class="tab-body" id="tab-chips" hidden></div>
        <div class="tab-body" id="tab-tech" hidden></div>
        <div class="tab-body" id="tab-heat" hidden></div>
      </div>
    </section>

    <aside class="side">
      <section class="panel watch">
        <div class="panel-head">
          <span>自選股</span>
          <button class="icon-btn" id="addWatch" title="將目前股票加入自選">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2"/></svg>
          </button>
        </div>
        <div class="wl-cols"><span>商品</span><span>成交</span><span>漲跌</span><span>幅度</span></div>
        <div class="wl-body" id="watchlist"></div>
      </section>
      <section class="panel quote" id="quotePanel"></section>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/lightweight-charts.js"></script>
  <script src="js/indicators.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    // 程式沒有完整載入（網站剛更新、網路不穩）時提示重新整理，而不是停在空白畫面
    setTimeout(function () {
      if (window.__app) return;
      var t = document.getElementById('toast');
      t.innerHTML = '網頁沒有完整載入（可能是網站剛更新或網路不穩）。<button type="button" onclick="location.reload()">重新整理</button>';
      t.hidden = false;
    }, 10000);
  </script>
</body>
</html>
